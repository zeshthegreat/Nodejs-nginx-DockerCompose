upstream backend_servers {
    least_conn;
    server api1:3001;
    server api2:3001;
    server api3:3001;
}

# Security layer
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Http caching
proxy_cache_path /data/nginx/cache 
                keys_zone=api_cache:10m
                max_size=1g
                inactive=30m
                use_temp_path=off;


# Compression
gzip on;
gzip_min_length 1000;

gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    image/svg+xml;

gzip_comp_level 5;

# To prevent access to site using IP address over HTTP
server { 
    listen 80 default_server;
    server_name _;
    return 444;
}

# To prevent access to site using IP address over HTTPS 	
server { 
    listen 443 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # cache
    location = /api/proccessData {
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        limit_req zone=api_limit;
        limit_req_status 429;
        proxy_pass http://backend_servers/proccessData;
    }

    # no cache
    location /api/ {
        limit_req zone=api_limit;
        limit_req_status 429;
        proxy_pass http://backend_servers/;
    }

    location /mongo/ {
        proxy_pass http://mongoExpress:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
